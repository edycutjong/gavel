name: CI

# gavel is a Node CLI, not a web app: there is no bundle to budget, no page to
# audit with Lighthouse, and no UI to drive with Playwright. Those stages are
# deliberately absent rather than faked. What IS here runs on every push.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: "Stage 1 · Tests"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ github.event_name == 'push' && fromJSON('[20, 22, 24]') || fromJSON('[20]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci
      # No network, no keys, no chain. If this ever needs a credential, the
      # separation between the test suite and the product has broken.
      - name: Tests
        run: npm test

  purity:
    name: "Stage 1 · Decision-surface purity"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: "npm" }
      - run: npm ci
      # Invariant I10: assemble.mjs is injected verbatim into a sandboxed code
      # node, so an import or an impure call would fail at runtime rather than
      # here. sync.mjs refuses to emit in that case; this asserts it in CI too.
      - name: assemble.mjs must stay pure and dependency-free
        run: |
          node -e "
          const s=require('fs').readFileSync('src/assemble.mjs','utf8');
          const bad=[/^\s*import\s/m,/\bimport\s*\(/,/\beval\s*\(/,/\bnew\s+Function\s*\(/,/\bfetch\s*\(/,/\bMath\.random\s*\(/,/\bDate\.now\s*\(/,/\bprocess\.env/];
          const hit=bad.filter(r=>r.test(s));
          if(hit.length){console.error('assemble.mjs is not pure:',hit.map(String).join(', '));process.exit(1);}
          console.log('assemble.mjs is pure');"

  security:
    name: "Stage 2 · Dependency audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: "npm" }
      - run: npm ci
      - name: npm audit (high + critical)
        run: npm audit --audit-level=high
        continue-on-error: true

  survey:
    name: "Stage 2 · Published figures re-derive"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # The 92.6% figure is the most load-bearing claim in the README. This asserts
      # it — and 21 other published numbers — against the committed survey data, so
      # the prose cannot drift away from the measurement without CI going red.
      - name: Re-derive every published survey figure
        run: python3 survey/rederive.py

      # bench.py is a reducer over committed rows, so CI can run it and get the
      # same numbers as a laptop. This asserts it still reduces what audit.mjs
      # writes -- a schema change upstream would otherwise surface as a stale
      # figure in the README rather than a red build.
      - name: Benchmark reducer runs against the committed receipts
        run: python3 scripts/bench.py

  contracts:
    name: "Stage 1 · Contract tests + 100% coverage"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      # No forge-std, no lib/, no submodules: the suite declares the four
      # cheatcodes it uses inline, so `libs = []` in foundry.toml stays true.
      - name: forge test
        run: forge test -vv

      # MockUSDC is testnet-only, but it is the token under every rehearsal
      # drain -- if its transfer is wrong, the inner-call-failed / GS013 fixture
      # proves the wrong failure. So the bar here is all four metrics at 100%,
      # enforced rather than eyeballed.
      - name: forge coverage must be 100% on every metric
        run: |
          set -euo pipefail
          forge coverage --no-match-coverage "test" --report summary | tee coverage.txt

          ROW=$(grep 'contracts/MockUSDC.sol' coverage.txt || true)
          if [ -z "$ROW" ]; then
            echo "::error::MockUSDC.sol is absent from the coverage report"
            exit 1
          fi

          # Deliberately not `grep | while read`: that runs the loop in a
          # subshell, so a failure inside it cannot fail the step. Same bug the
          # Pages workflow calls out; same fix.
          rc=0
          for PCT in $(echo "$ROW" | grep -oE '[0-9]+\.[0-9]+%'); do
            if [ "$PCT" != "100.00%" ]; then echo "::error::coverage below bar: $PCT"; rc=1; fi
          done

          # Four columns are reported (lines, statements, branches, funcs). If
          # the table format ever changes, fail rather than silently check three.
          COUNT=$(echo "$ROW" | grep -oE '[0-9]+\.[0-9]+%' | wc -l | tr -d ' ')
          if [ "$COUNT" -ne 4 ]; then
            echo "::error::expected 4 coverage metrics, parsed $COUNT -- report format changed"
            rc=1
          fi

          [ "$rc" -eq 0 ] && echo "MockUSDC.sol: 100% lines, statements, branches and funcs"
          exit $rc

  gate:
    name: "Stage 3 · Gate"
    needs: [quality, purity, security, survey, contracts]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - run: echo "tests + purity + audit passed"
