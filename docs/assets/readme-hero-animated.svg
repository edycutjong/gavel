<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img"
     aria-label="gavel — executes Safe transactions that reached their signature threshold but were never executed. A threshold-met Safe transaction waits amber; the gavel falls, and it turns mint: executed.">
<!-- STORYBOARD (dur 8s — the single master dur of this file)
  0-10%   steady state: plate, grid, brand block left (mark, outlined wordmark, tagline, metric, stack); right: queue card amber - SAFE/nonce, dots 2/3, "stalled 9d 04h", payload line; mallet poised above the card.
  10-25%  trigger:      the last signature lands - third dot fills, 2/3 -> 3/3.                   data-story="beat-2"
  25-55%  mechanism:    A threshold-met Safe transaction waits amber; the gavel falls, and it turns mint: executed.   data-story="beat-3"
  55-80%  resolution:   EXECUTED + tx hash hold mint; comet reaches the Base chip; +4,200 USDC lands; residue persists.   data-story="beat-4"
  80-100% breathe + seam fade: shimmer passes the wordmark; story overlays settle out by 95.5%; card returns to stalled amber.
  The strike stops short of the card: measured lowest mallet pixel y=63 at rest, y=93 at the impact
  frame, card top y=96 — a 33px fall that closes to 3px and never to zero.
-->
  <title>gavel — the last signature is never the last step</title>
  <defs>
    <linearGradient id="rh-wordgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#C3CCD8"/>
    </linearGradient>
    <pattern id="rh-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <linearGradient id="rh-beamgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB020" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFB020" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFB020" stop-opacity="0"/>
    </linearGradient>
    <filter id="rh-soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="rh-spark" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="rh-wmclip">
      <path transform="translate(176 150)" d="M5.4-29L5.4-30.9Q5.4-40.1 9.1-46.7Q12.7-53.2 18.8-56.7Q24.9-60.2 32.1-60.2Q40.1-60.2 44.3-57.3Q48.4-54.5 50.3-51.4L52.4-51.4L52.4-58.5L67-58.5L67 10.4Q67 16.4 63.5 20Q59.9 23.6 54 23.6L14.9 23.6L14.9 10.6L48.9 10.6Q52.2 10.6 52.2 7.1L52.2-8.1L50-8.1Q48.9-6.3 46.7-4.3Q44.6-2.4 41.1-1.1Q37.5 0.2 32.1 0.2Q24.9 0.2 18.8-3.2Q12.7-6.7 9.1-13.3Q5.4-19.8 5.4-29M36.3-12.7Q43.2-12.7 47.8-17.1Q52.4-21.5 52.4-29.4L52.4-30.6Q52.4-38.6 47.8-42.9Q43.3-47.2 36.3-47.2Q29.5-47.2 24.9-42.9Q20.3-38.6 20.3-30.6L20.3-29.4Q20.3-21.5 24.9-17.1Q29.5-12.7 36.3-12.7M101.7 1.7Q95.5 1.7 90.5-0.5Q85.6-2.7 82.7-6.9Q79.8-11.1 79.8-17.1Q79.8-23.1 82.7-27.2Q85.6-31.3 90.7-33.3Q95.8-35.4 102.4-35.4L118.5-35.4L118.5-38.7Q118.5-42.8 115.9-45.5Q113.3-48.1 107.6-48.1Q102.1-48.1 99.4-45.6Q96.6-43.1 95.8-39.1L82.1-43.7Q83.5-48.1 86.7-51.9Q89.8-55.6 95-57.9Q100.3-60.2 107.9-60.2Q119.4-60.2 126.1-54.4Q132.9-48.6 132.9-37.6L132.9-15.8Q132.9-12.3 136.2-12.3L140.9-12.3L140.9 0L131 0Q126.6 0 123.8-2.1Q121-4.2 121-7.8L121-7.9L118.7-7.9Q118.2-6.5 116.6-4.2Q114.9-1.9 111.4-0.1Q107.9 1.7 101.7 1.7M104.3-10.4Q110.6-10.4 114.5-13.9Q118.5-17.3 118.5-23.1L118.5-24.3L103.5-24.3Q99.4-24.3 97-22.5Q94.6-20.8 94.6-17.6Q94.6-14.4 97.1-12.4Q99.6-10.4 104.3-10.4M184.3 0L160.7 0L142.1-58.5L157.9-58.5L171.5-10.9L173.6-10.9L187.1-58.5L203-58.5L184.3 0M238.1 1.7Q229.4 1.7 222.7-2.1Q216.1-5.8 212.3-12.6Q208.6-19.4 208.6-28.6L208.6-30Q208.6-39.2 212.3-46Q215.9-52.7 222.5-56.5Q229.2-60.2 237.9-60.2Q246.5-60.2 252.9-56.3Q259.2-52.5 262.8-45.7Q266.3-38.9 266.3-30L266.3-24.9L223.7-24.9Q224-18.9 228.2-15.1Q232.5-11.3 238.6-11.3Q244.9-11.3 247.8-14Q250.8-16.8 252.3-20.1L264.4-13.7Q262.8-10.6 259.7-7Q256.5-3.4 251.3-0.9Q246.1 1.7 238.1 1.7M223.8-36L251.2-36Q250.8-41.1 247.2-44.1Q243.6-47.2 237.8-47.2Q231.8-47.2 228.2-44.1Q224.7-41.1 223.8-36"/>
      <path transform="translate(446 150)" d="M23.1 0L8.3 0L8.3-82.6L23.1-82.6"/>
    </clipPath>
  </defs>
  <style>
    text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .rh-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .rh-breath { animation: rh-breathe 8s ease-in-out infinite; }
    @keyframes rh-breathe { 0% { opacity: 0.55; } 50% { opacity: 1; } 100% { opacity: 0.55; } }
    .rh-pulse { animation: rh-pulsate 8s ease-in-out infinite; }
    @keyframes rh-pulsate { 0% { opacity: 0.72; } 45% { opacity: 1; } 100% { opacity: 0.72; } }
    .rh-aur-a { animation: rh-drift-a 16s ease-in-out infinite alternate; }
    @keyframes rh-drift-a { from { transform: translate(0, 0); } to { transform: translate(46px, 18px); } }
    .rh-aur-b { animation: rh-drift-b 19s ease-in-out infinite alternate; }
    @keyframes rh-drift-b { from { transform: translate(0, 0); } to { transform: translate(-52px, -14px); } }
    .rh-pop { transform-box: fill-box; transform-origin: center;
              animation: rh-popk 8s cubic-bezier(.2,1.4,.4,1) infinite; }
    @keyframes rh-popk { 0%, 39% { transform: scale(0.92); } 44% { transform: scale(1.05); }
                         48%, 100% { transform: scale(1); } }
    /* Reduced motion must also stop SMIL — `animation: none` only reaches CSS.
       Author !important outranks the animation origin in the cascade, so these
       rules pin the file to its poster frame: amber stalled card, 2/3 dots,
       mallet poised, no strike, no shimmer. Measured in a real engine, not assumed. */
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      [data-story]  { opacity: 0 !important; }   /* every story overlay off        */
      .rh-base      { opacity: 1 !important; }   /* base text SMIL-faded mid-loop  */
      .rh-shimmer   { opacity: 0 !important; }   /* decorative sweep, no still pos */
      .rh-swing     { transform: none !important; } /* mallet pinned to rest       */
    }
  </style>

  <!-- ================= backdrop (opaque plate: self-sufficient on light GitHub) ================= -->
  <rect x="0.5" y="0.5" width="1279" height="319" rx="20" fill="#0B0E13" stroke="#232B36"/>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="20" fill="url(#rh-grid)"/>
  <g class="rh-aur-a"><circle cx="180" cy="50" r="190" fill="#FFB020" opacity="0.10" filter="url(#rh-soft)"/></g>
  <g class="rh-aur-b"><circle cx="1130" cy="290" r="170" fill="#00E5A0" opacity="0.08" filter="url(#rh-soft)"/></g>

  <!-- beam sweep: one pass per loop, dark at both seam ends; crosses during the trigger window -->
  <g opacity="0" data-story="beat-2">
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
      values="0;0;0.6;0.6;0;0" keyTimes="0;0.05;0.09;0.28;0.34;1"/>
    <rect x="-160" y="0" width="150" height="320" fill="url(#rh-beamgrad)" transform="skewX(-16)">
      <animateTransform attributeName="transform" type="translate" additive="sum" dur="8s" repeatCount="indefinite"
        values="-160 0;-160 0;1560 0;1560 0" keyTimes="0;0.05;0.34;1"/>
    </rect>
  </g>

  <!-- ================= left: brand (every element visible at t=0) ================= -->
  <text x="52" y="56" class="rh-mono" font-size="12" font-weight="600" letter-spacing="2.2" fill="#8A97A8">NON-OWNER SAFE QUEUE EXECUTOR · LAST SIGNATURE</text>

  <!-- mini mark -->
  <g class="rh-breath">
    <g transform="translate(48 68) scale(3.25)">
      <rect x="3" y="25" width="26" height="5" rx="2.5" fill="#8A97A8" opacity="0.55"/>
      <line x1="17" y1="12" x2="26" y2="21" stroke="#FFD27A" stroke-width="4.2" stroke-linecap="round"/>
      <line x1="13" y1="18" x2="23" y2="8" stroke="#B26A00" stroke-width="10" stroke-linecap="round"/>
      <line x1="12" y1="17" x2="22" y2="7" stroke="#FFB020" stroke-width="10" stroke-linecap="round"/>
    </g>
  </g>

  <!-- outlined wordmark: gave (ramp) + l (amber, the shaft echo). Space Grotesk 700, outlined. -->
  <path transform="translate(176 150)" fill="url(#rh-wordgrad)" d="M5.4-29L5.4-30.9Q5.4-40.1 9.1-46.7Q12.7-53.2 18.8-56.7Q24.9-60.2 32.1-60.2Q40.1-60.2 44.3-57.3Q48.4-54.5 50.3-51.4L52.4-51.4L52.4-58.5L67-58.5L67 10.4Q67 16.4 63.5 20Q59.9 23.6 54 23.6L14.9 23.6L14.9 10.6L48.9 10.6Q52.2 10.6 52.2 7.1L52.2-8.1L50-8.1Q48.9-6.3 46.7-4.3Q44.6-2.4 41.1-1.1Q37.5 0.2 32.1 0.2Q24.9 0.2 18.8-3.2Q12.7-6.7 9.1-13.3Q5.4-19.8 5.4-29M36.3-12.7Q43.2-12.7 47.8-17.1Q52.4-21.5 52.4-29.4L52.4-30.6Q52.4-38.6 47.8-42.9Q43.3-47.2 36.3-47.2Q29.5-47.2 24.9-42.9Q20.3-38.6 20.3-30.6L20.3-29.4Q20.3-21.5 24.9-17.1Q29.5-12.7 36.3-12.7M101.7 1.7Q95.5 1.7 90.5-0.5Q85.6-2.7 82.7-6.9Q79.8-11.1 79.8-17.1Q79.8-23.1 82.7-27.2Q85.6-31.3 90.7-33.3Q95.8-35.4 102.4-35.4L118.5-35.4L118.5-38.7Q118.5-42.8 115.9-45.5Q113.3-48.1 107.6-48.1Q102.1-48.1 99.4-45.6Q96.6-43.1 95.8-39.1L82.1-43.7Q83.5-48.1 86.7-51.9Q89.8-55.6 95-57.9Q100.3-60.2 107.9-60.2Q119.4-60.2 126.1-54.4Q132.9-48.6 132.9-37.6L132.9-15.8Q132.9-12.3 136.2-12.3L140.9-12.3L140.9 0L131 0Q126.6 0 123.8-2.1Q121-4.2 121-7.8L121-7.9L118.7-7.9Q118.2-6.5 116.6-4.2Q114.9-1.9 111.4-0.1Q107.9 1.7 101.7 1.7M104.3-10.4Q110.6-10.4 114.5-13.9Q118.5-17.3 118.5-23.1L118.5-24.3L103.5-24.3Q99.4-24.3 97-22.5Q94.6-20.8 94.6-17.6Q94.6-14.4 97.1-12.4Q99.6-10.4 104.3-10.4M184.3 0L160.7 0L142.1-58.5L157.9-58.5L171.5-10.9L173.6-10.9L187.1-58.5L203-58.5L184.3 0M238.1 1.7Q229.4 1.7 222.7-2.1Q216.1-5.8 212.3-12.6Q208.6-19.4 208.6-28.6L208.6-30Q208.6-39.2 212.3-46Q215.9-52.7 222.5-56.5Q229.2-60.2 237.9-60.2Q246.5-60.2 252.9-56.3Q259.2-52.5 262.8-45.7Q266.3-38.9 266.3-30L266.3-24.9L223.7-24.9Q224-18.9 228.2-15.1Q232.5-11.3 238.6-11.3Q244.9-11.3 247.8-14Q250.8-16.8 252.3-20.1L264.4-13.7Q262.8-10.6 259.7-7Q256.5-3.4 251.3-0.9Q246.1 1.7 238.1 1.7M223.8-36L251.2-36Q250.8-41.1 247.2-44.1Q243.6-47.2 237.8-47.2Q231.8-47.2 228.2-44.1Q224.7-41.1 223.8-36"/>
  <path transform="translate(446 150)" fill="#FFB020" d="M23.1 0L8.3 0L8.3-82.6L23.1-82.6"/>

  <!-- shimmer: one pass in the back half, clipped to the wordmark glyphs -->
  <g clip-path="url(#rh-wmclip)" class="rh-shimmer">
    <g>
      <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite"
        values="-140 0;-140 0;480 0;480 0" keyTimes="0;0.60;0.78;1"/>
      <rect x="150" y="50" width="58" height="130" fill="#FFFFFF" opacity="0.32" transform="skewX(-18)"/>
    </g>
  </g>

  <!-- tagline -->
  <text x="52" y="210" font-size="19" fill="#C3CCD8">Executes threshold-met Safe transactions</text>
  <text x="52" y="237" font-size="19" fill="#C3CCD8">from a wallet that owns nothing.</text>

  <!-- hero metric line (pulsing) -->
  <g class="rh-pulse">
    <text x="52" y="269" class="rh-mono" font-size="15" font-weight="600">
      <tspan fill="#FFB020">stalled 9d 04h</tspan>
      <tspan fill="#8A97A8" dx="6">→</tspan>
      <tspan fill="#00E5A0" dx="6">executed in one sweep</tspan>
    </text>
  </g>

  <!-- tech line -->
  <text x="52" y="295" class="rh-mono" font-size="12" letter-spacing="0.4" fill="#8A97A8">KeeperHub · Safe v1.4.1 · Base 8453 · USDC · execTransaction</text>

  <!-- ================= right: the mechanism ================= -->

  <!-- queue card (the strike block of this composition) -->
  <rect x="568" y="96" width="400" height="176" rx="14" fill="#12161D" stroke="#B26A00" stroke-width="1.5"/>
  <rect x="568" y="96" width="400" height="176" rx="14" fill="none" stroke="#00E5A0" stroke-width="1.5" opacity="0" data-story="beat-3">
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
      values="0;0;1;1;0;0" keyTimes="0;0.38;0.44;0.90;0.955;1"/>
  </rect>

  <text x="592" y="130" class="rh-mono" font-size="13" letter-spacing="0.6" fill="#8A97A8">SAFE 0x51C4…9aB2 · NONCE 41</text>

  <!-- threshold dots: 2 of 3 -->
  <circle cx="600" cy="158" r="8" fill="#FFB020"/>
  <circle cx="628" cy="158" r="8" fill="#FFB020"/>
  <circle cx="656" cy="158" r="8" fill="none" stroke="#8A97A8" stroke-width="2.5"/>
  <circle cx="656" cy="158" r="8" fill="#FFB020" opacity="0" data-story="beat-2">
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
      values="0;0;1;1;0;0" keyTimes="0;0.10;0.17;0.90;0.955;1"/>
  </circle>
  <text x="684" y="163" class="rh-mono rh-base" font-size="13" font-weight="600" fill="#C3CCD8">
    2 / 3 SIGNED
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
      values="1;1;0;0;1;1" keyTimes="0;0.10;0.17;0.90;0.955;1"/>
  </text>
  <text x="684" y="163" class="rh-mono" font-size="13" font-weight="600" fill="#FFB020" opacity="0" data-story="beat-2">
    3 / 3 SIGNED
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
      values="0;0;1;1;0;0" keyTimes="0;0.10;0.17;0.90;0.955;1"/>
  </text>

  <!-- the stall clock (base state) -->
  <text x="592" y="222" class="rh-mono rh-base" font-size="34" font-weight="700" fill="#FFB020">
    stalled 9d 04h
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
      values="1;1;0;0;1;1" keyTimes="0;0.38;0.44;0.90;0.955;1"/>
  </text>

  <!-- executed state (story swap) -->
  <g opacity="0" data-story="beat-3" class="rh-pop">
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
      values="0;0;1;1;0;0" keyTimes="0;0.40;0.47;0.90;0.955;1"/>
    <text x="592" y="214" class="rh-mono" font-size="26" font-weight="700" fill="#00E5A0">▲ EXECUTED</text>
    <text x="592" y="238" class="rh-mono" font-size="13" fill="#00E5A0">tx 0x7f3a…c9d1 · verified: true</text>
  </g>

  <!-- payload line (persists through both states) -->
  <text x="592" y="258" class="rh-mono" font-size="13" fill="#C3CCD8">4,200 USDC → payee 0x9c…4e21</text>

  <!-- the mallet, poised above the card; falls at beat 3 (stops 2px short) -->
  <g class="rh-swing">
    <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite"
      values="0 0;0 0;0 -6;0 30;0 30;0 0;0 0" keyTimes="0;0.25;0.31;0.38;0.5;0.88;1"
      calcMode="spline"
      keySplines="0.4 0 0.6 1;0.5 0 0.8 0.6;0.7 0 0.9 1;0.2 0.8 0.4 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
    <g transform="translate(806 4) scale(2.6)">
      <line x1="17" y1="12" x2="26" y2="21" stroke="#FFD27A" stroke-width="4.2" stroke-linecap="round"/>
      <line x1="13" y1="18" x2="23" y2="8" stroke="#B26A00" stroke-width="10" stroke-linecap="round"/>
      <line x1="12" y1="17" x2="22" y2="7" stroke="#FFB020" stroke-width="10" stroke-linecap="round"/>
    </g>
  </g>

  <!-- impact ripple on the card's top edge -->
  <circle cx="840" cy="96" fill="none" stroke="#FFD27A" stroke-width="3" opacity="0" data-story="beat-3">
    <animate attributeName="r" dur="8s" repeatCount="indefinite"
      values="8;8;74;74" keyTimes="0;0.38;0.52;1"/>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
      values="0;0;0.75;0;0" keyTimes="0;0.38;0.41;0.52;1"/>
  </circle>

  <!-- comet: value leaves the Safe toward Base -->
  <circle r="7" fill="#00E5A0" filter="url(#rh-spark)" opacity="0" data-story="beat-3">
    <animateMotion dur="8s" repeatCount="indefinite"
      path="M 968,180 C 996,176 1006,174 1034,172"
      keyPoints="0;0;1;1" keyTimes="0;0.46;0.57;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
      values="0;0;0.95;0.95;0;0" keyTimes="0;0.46;0.48;0.55;0.58;1"/>
  </circle>

  <!-- chain chip -->
  <rect x="1030" y="140" width="186" height="64" rx="12" fill="#12161D" stroke="#232B36" stroke-width="1.5"/>
  <rect x="1030" y="140" width="186" height="64" rx="12" fill="none" stroke="#00E5A0" stroke-width="1.5" opacity="0" data-story="beat-4">
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
      values="0;0;1;1;0;0" keyTimes="0;0.56;0.62;0.90;0.955;1"/>
  </rect>
  <rect x="1048" y="166" width="11" height="11" rx="2.5" fill="#0052FF"/>
  <text x="1068" y="177" class="rh-mono" font-size="14" font-weight="600" fill="#C3CCD8">BASE 8453</text>
  <text x="1123" y="128" class="rh-mono" font-size="14" font-weight="700" fill="#00E5A0" text-anchor="middle" opacity="0" data-story="beat-4">
    +4,200 USDC
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
      values="0;0;1;1;0;0" keyTimes="0;0.58;0.65;0.90;0.955;1"/>
  </text>
  <text x="1123" y="228" class="rh-mono" font-size="11" letter-spacing="0.8" fill="#8A97A8" text-anchor="middle">RECEIPT · BASESCAN</text>
</svg>
